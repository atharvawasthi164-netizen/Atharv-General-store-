<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atharv General Store | Bijwar, Sitapur</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
background:#f5f7f6;
color:#17201b;
line-height:1.5
}
header{
background:linear-gradient(135deg,#087f45,#12a866);
color:white;
padding:25px 18px;
text-align:center;
}
header h1{font-size:30px;margin-bottom:5px}
header p{font-size:15px;opacity:.95}

.container{max-width:900px;margin:auto;padding:18px}

.hero{
background:white;
border-radius:18px;
padding:22px;
margin-top:15px;
box-shadow:0 5px 20px #00000012;
text-align:center
}
.hero h2{font-size:25px;color:#087f45;margin-bottom:8px}
.hero p{color:#555}

.badges{
display:flex;
gap:8px;
flex-wrap:wrap;
justify-content:center;
margin:18px 0
}
.badge{
background:#e9f8f0;
color:#087f45;
padding:8px 12px;
border-radius:30px;
font-size:13px;
font-weight:bold
}

.photos{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:15px
}
.photos img{
width:100%;
height:220px;
object-fit:cover;
border-radius:14px
}

.section{
background:white;
border-radius:18px;
padding:20px;
margin-top:18px;
box-shadow:0 5px 20px #00000010
}
.section h2{
color:#087f45;
margin-bottom:15px;
font-size:22px
}

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px
}
.product{
background:#f5f8f6;
padding:14px;
border-radius:12px;
font-weight:bold
}

.orderbox{
background:#eaf8f1;
border:1px solid #bce8d0;
border-radius:14px;
padding:18px;
margin-top:15px
}

button,.btn{
border:0;
border-radius:12px;
padding:13px 17px;
font-size:16px;
font-weight:bold;
cursor:pointer;
text-decoration:none;
display:inline-block;
margin-top:10px
}
.whatsapp{
background:#25D366;
color:white
}
.call{
background:#087f45;
color:white
}

.contact p{margin:8px 0}

footer{
margin-top:25px;
background:#102019;
color:white;
text-align:center;
padding:25px 15px;
font-size:14px
}

@media(max-width:500px){
header h1{font-size:26px}
.photos img{height:180px}
.products{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>

<header>
<h1>🛒 Atharv General Store</h1>
<p>Your Local Grocery & Daily Needs Store</p>
</header>

<div class="container">

<div class="hero">
<h2>Welcome to Atharv General Store</h2>
<p>
Grocery aur daily-use products ab aapke ghar tak.
Azad Nagar, Bijwar, Sitapur mein convenient home delivery.
</p>

<div class="badges">
<span class="badge">🚚 Home Delivery</span>
<span class="badge">₹5 Delivery</span>
<span class="badge">
